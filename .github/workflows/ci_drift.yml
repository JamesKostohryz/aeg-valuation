name: did CI actually run?

# THE GAP NO TEST INSIDE THIS REPOSITORY CAN SEE. Every check here answers "is the code right?".
# None answers "did anything check?" -- and on 2026-08-19 that was three separate ways to lose
# CI in one afternoon: a commit message that merely QUOTED the CI-skip marker and was skipped
# because of it; regression.yml's path filters not covering idio/**, so the discount-rate module
# triggered nothing; and a workflow-authored push, which triggers nothing by design.
#
# All three look identical from inside: green, because nothing ran. This asks GitHub instead.

on:
  schedule:
    - cron: "0 13 * * 1-5"     # weekday mornings, after the overnight bots have pushed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Has the regression harness run on main's head, and did it pass?
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/ci_drift.py

name: AEG regression harness

on:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "pipeline/**"
      - "idio/**"
      - "requirements.txt"
      - ".github/workflows/**"
      # companies/** was missing until 2026-08-20, and test_reviewed_forecast.py reads
      # companies/PEP.forecast.json. So editing a forecast -- a horizon, a driver, the most
      # consequential edit anyone makes here -- ran no harness at all. Caught by ci_drift.py
      # on its first run, on the commit that changed PepsiCo's bear case.
      - "companies/**"
      # data/** joined the filters on 2026-08-20 with the committed bond snapshot. The issuer
      # credit curves are FITTED from data/bond_spreads/*, so an edit there moves every
      # company's Region 2 premium while touching no .py file at all.
      - "data/**"
      - "MODEL_TEMPLATE.xlsx"
      - "tests/**"
      - ".github/workflows/regression.yml"
  pull_request:
    paths:
      - "*.py"
      - "pipeline/**"
      - "idio/**"
      - "requirements.txt"
      - ".github/workflows/**"
      # companies/** was missing until 2026-08-20, and test_reviewed_forecast.py reads
      # companies/PEP.forecast.json. So editing a forecast -- a horizon, a driver, the most
      # consequential edit anyone makes here -- ran no harness at all. Caught by ci_drift.py
      # on its first run, on the commit that changed PepsiCo's bear case.
      - "companies/**"
      # data/** joined the filters on 2026-08-20 with the committed bond snapshot. The issuer
      # credit curves are FITTED from data/bond_spreads/*, so an edit there moves every
      # company's Region 2 premium while touching no .py file at all.
      - "data/**"
      - "MODEL_TEMPLATE.xlsx"
      - "tests/**"
      - ".github/workflows/regression.yml"
  workflow_dispatch:
    inputs:
      scope:
        description: "grid scope: quick | standard | full"
        required: false
        default: "standard"

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LibreOffice + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run regression harness (tie is the oracle)
        run: |
          set -euo pipefail
          SCOPE="${{ github.event.inputs.scope || 'standard' }}"
          FLAG=""
          [ "$SCOPE" = "quick" ] && FLAG="--quick"
          [ "$SCOPE" = "full" ]  && FLAG="--full"
          python test_regression.py $FLAG

name: run-valuation (cockpit RUN button)

# Dispatch-ONLY. Driven by the Cost of Capital cockpit's RUN button via the Apps Script
# (COCKPIT dispatch contract 20260722-0800). Deliberately separate from valuation.yml:
# that one is the CI path (fires on push), and a malformed payload here must never be able
# to redden CI.
#
# workflow_dispatch inputs are strings, so the WHOLE payload rides as ONE JSON string:
#   { "ticker": "AAPL", "mode": "Equity"|"Enterprise", "N": 1..30,
#     "drivers": { revenue_growth|gross_margin|sga_ratio|da_rate|tax_rate|
#                  buyback_rate|capex_ratio|noa_growth : [ ..N values.. ] },
#     "singles": { "payout": <num>, "target_flev": <num> } }
#
# A driver ABSENT from `drivers` is not written at all, so it keeps its existing formula
# (hold flat at the FY0 anchor, or the legacy scenario overlay). That is what makes a
# legacy run bit-identical — verified: empty payload reproduces the engine to the digit.

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "AEG forecast payload (JSON)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: run-valuation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN raises the GitHub REST rate limit from 60 requests an hour PER IP to 1,000,
    # which is what lets idio/market_erp_live.py establish the VINTAGE of the aggregate credit
    # curve. Unauthenticated, a shared runner burns 60 in minutes and gets 403 -- and until
    # 2026-08-20 that silently disabled the freshness check on COMMON(t), which is charged to
    # every company at every tenor. It now REFUSES instead, so without this the run stops.
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout market-data (canonical company data store)
        uses: actions/checkout@v4
        with:
          repository: JamesKostohryz/market-data
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: market-data-checkout

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LibreOffice (headless recalc)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-calc

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The second bond source, and the Treasury leg the issuer curves are stripped against.
      - name: Checkout real-yields
        uses: actions/checkout@v4
        with:
          repository: JamesKostohryz/real-yields
          path: _real_yields

      # ------------------------------------------------------------------ ON-DEMAND CREDIT
      # WHY THIS IS HERE AND NOT ON A CRON. `outputs/issuer_widen_latest.csv` expires at
      # `idio/erp.py::ISSUER_WIDEN_MAX_AGE_DAYS`, and past that EVERY valuation refuses with
      # PremiumRefused. A monthly cron would stop that -- by re-pricing three thousand bonds
      # in months when nothing is valued, and by making the curves fresh as of the 2nd of the
      # month rather than as of the valuation. Nothing reads these curves except a valuation
      # in progress, so the honest place to refresh them is immediately before one.
      #
      # It only fires when the curves are actually stale, so valuing three companies in a week
      # re-prices once, not three times. REFRESH_MARGIN_DAYS refreshes a little before the
      # cliff rather than exactly on it, so a valuation never lands on the boundary.
      - name: Refresh the issuer credit curves if they are stale
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          python - <<'EOF'
          import datetime as dt, json, os, subprocess, sys
          MARGIN = 5
          meta = json.load(open("outputs/tier3_fit.json"))
          sys.path.insert(0, "idio"); import erp as IE
          gen = dt.date.fromisoformat(meta["generated"])
          age = (dt.date.today() - gen).days
          limit = IE.ISSUER_WIDEN_MAX_AGE_DAYS - MARGIN
          print("issuer credit curves generated %s, %d days ago (refresh at %d, refuse at %d)"
                % (gen, age, limit, IE.ISSUER_WIDEN_MAX_AGE_DAYS))
          if age <= limit:
              print("fresh enough -- no bonds pulled, no API units spent.")
              raise SystemExit(0)
          print("STALE. Re-pricing the bonds and refitting before this valuation runs.")
          subprocess.run([sys.executable, "idio/bond_reprice.py",
                          "--cache", os.environ["RUNNER_TEMP"] + "/px"], check=True)
          subprocess.run([sys.executable, "idio/issuer_curves.py", "--outdir", "outputs",
                          "--real-yields", "_real_yields",
                          "--max-bond-age-days", "7"], check=True)
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write("CURVES_REFRESHED=1\n")
          EOF

      # ---------------------------------------------------------------- V2 SCORE ON-DEMAND TOP-UP
      # Task 27, 2026-08-21. James: refresh credit "in a limited way every time a new valuation
      # is made", and put-IV likewise. The scheduled jobs (idio_credit_quarterly.yml, monthly;
      # idio_putiv_monthly.yml, monthly) are the primary refresh path -- this is the safety net
      # for a scheduled job that silently stopped firing, and it is what makes company_curve_v2's
      # own staleness gate (idio/snapshot_build.py::check_staleness, task 22) something a
      # valuation can usually route around rather than simply refuse on.
      #
      # CREDIT is genuinely toppable here: if the step above just re-priced and refit the bonds
      # (CURVES_REFRESHED=1) OR the v2 snapshot's own credit_spread leg is independently stale
      # against its looser 100-day quarterly policy, rebuild the v2 credit block from whatever
      # fit is on disk -- cheap, no new API spend if CURVES_REFRESHED already did the pull.
      #
      # PUT-IV is NOT toppable here, on purpose, and this step does not pretend otherwise.
      # idio/svix/svix_layer1.py needs a peer pool (~20+ names) fit in the SAME run to complete
      # an arbitrage-free surface (see that module's own docstring); fabricating one for a single
      # ticker mid-valuation would be exactly the "silently degraded number wearing the real
      # number's name" failure this project keeps a standing suspicion against. If the put_iv leg
      # is stale, this step says so, loudly, in the run's own summary -- it does not fetch
      # anything.
      - name: Top up the v2 score's stale legs before this valuation runs (limited)
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os, subprocess, sys
          sys.path.insert(0, "idio")
          import snapshot_build as SB

          snap_path = "outputs/idio_snapshot_latest.json"
          if not os.path.exists(snap_path):
              print("## V2 score top-up\n\nno v2 snapshot on disk yet -- nothing to top up "
                    "(first snapshot_build.py --write will create one).")
              raise SystemExit(0)
          snap = json.load(open(snap_path))
          stale = SB.check_staleness(snap)

          print("## V2 score legs, before this valuation\n")
          for leg, s in stale.items():
              flag = "STALE" if s["stale"] else "ok"
              print("* %s: %s days old (limit %d) -- %s" % (leg, s["age_days"], s["max_age_days"], flag))

          credit_refreshed_bonds = os.environ.get("CURVES_REFRESHED") == "1"
          need_credit_rebuild = credit_refreshed_bonds or stale["credit_spread"]["stale"]

          if need_credit_rebuild:
              if stale["credit_spread"]["stale"] and not credit_refreshed_bonds:
                  print("\ncredit_spread leg is stale on its own 100-day quarterly policy "
                        "(independently of the OLD system's tighter 45-day check above) -- "
                        "re-pricing and refitting now.")
                  subprocess.run([sys.executable, "idio/bond_reprice.py",
                                  "--cache", os.environ["RUNNER_TEMP"] + "/px"], check=True)
                  subprocess.run([sys.executable, "idio/issuer_curves.py", "--outdir", "outputs",
                                  "--real-yields", "_real_yields",
                                  "--max-bond-age-days", "7"], check=True)
              print("\nrebuilding the v2 credit block from the current issuer curve fit.")
              subprocess.run([sys.executable, "idio/credit_block.py", "--write"], check=True)
          else:
              print("\ncredit_spread leg fresh enough -- no rebuild needed.")

          if stale["put_iv"]["stale"]:
              print("\n**WARNING: put-IV leg is %s days old (limit %d).** This job does NOT "
                    "refit put-IV for a single ticker -- see idio_live_fetch.py and "
                    "idio/svix/svix_layer1.py's own docstrings for why (a peer pool must be fit "
                    "in the same run). Run idio_putiv_monthly.yml, or wait for its next "
                    "scheduled run (12th of the month)." % (stale["put_iv"]["age_days"], stale["put_iv"]["max_age_days"]))

          if need_credit_rebuild:
              print("\nrebuilding the v2 full-universe score and snapshot from the topped-up inputs.")
              subprocess.run([sys.executable, "idio/score_v2.py"], check=True)
              subprocess.run([sys.executable, "idio/snapshot_build.py", "--write"], check=True)
          EOF

      # Fail fast on a malformed payload BEFORE building anything, so a bad button press
      # costs seconds and produces a readable error instead of a mid-pipeline traceback.
      - name: Validate payload
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          python - <<'EOF'
          import json, os, sys
          sys.path.insert(0, "pipeline"); sys.path.insert(0, ".")
          import apply_payload as AP
          raw = os.environ["PAYLOAD"]
          try:
              p = AP.load_payload(raw)
          except AP.PayloadError as e:
              print(f"::error::{e}"); sys.exit(1)

          # Multi-scenario dispatch (payload.scenarios present): the machine-file shape
          # run_scenarios.py / run_company.py already consume in production, gated behind
          # payload.scenarios exactly as the pipeline is. Added 2026-08-12 because this
          # pre-flight step was still assuming the single-scenario shape and rejected every
          # scenarios payload with "mode must be ... got None" before run_company.py ever
          # got a chance to route it correctly. Mirrors what run_company.py itself does:
          # validate_overrides() at the top level, then a structural + per-scenario driver
          # check here so a malformed scenario still fails fast, before LibreOffice spins
          # up, rather than only failing deep inside the "Run valuation" step.
          if p.get("scenarios") is not None:
              import run_scenarios as RS
              try:
                  AP.validate_overrides(p)
                  ticker = p.get("ticker")
                  if not isinstance(ticker, str) or not ticker.strip():
                      raise AP.PayloadError("'ticker' must be a non-empty string")
                  names, total = RS._validate_scenarios(p["scenarios"])
                  if abs(total - 1.0) > RS.PROB_TOL:
                      print(f"::warning::scenario probabilities sum to {total}, not 1.0 "
                            f"(tolerance {RS.PROB_TOL}) -- cockpit-enforced, not blocked here")
                  for sc in p["scenarios"]:
                      single = {"ticker": ticker, "mode": sc.get("mode"), "N": sc.get("N"),
                                "drivers": sc.get("drivers") or {}, "singles": sc.get("singles") or {}}
                      AP.validate_payload(single)
              except AP.PayloadError as e:
                  print(f"::error::{e}"); sys.exit(1)
              except RS.ScenariosError as e:
                  print(f"::error::{e}"); sys.exit(1)
              cfg = os.path.join("companies", f"{ticker}.yaml")
              if not os.path.exists(cfg):
                  print(f"::error::no config for {ticker} ({cfg}). Onboard it first.")
                  sys.exit(1)
              print(f"payload OK: {ticker} scenarios={names} (probabilities sum to {total})")
              with open(os.environ["GITHUB_ENV"], "a") as fh:
                  fh.write(f"TICKER={ticker}\n")
              with open("payload.json", "w") as fh:
                  json.dump(p, fh)
              sys.exit(0)

          try:
              ticker, mode, N = AP.validate_payload(p)
          except AP.PayloadError as e:
              print(f"::error::{e}"); sys.exit(1)
          cfg = os.path.join("companies", f"{ticker}.yaml")
          if not os.path.exists(cfg):
              print(f"::error::no config for {ticker} ({cfg}). Onboard it first: "
                    f"python pipeline/onboard.py {ticker} --check-only  (then without --check-only). "
                    f"If that reports NOT READY, the rate side must publish coe_v2_{ticker} first.")
              sys.exit(1)
          drivers = sorted((p.get("drivers") or {}))
          held = sorted(set(AP.DRIVER_ROWS) - set(drivers))
          print(f"payload OK: {ticker} mode={mode} N={N}")
          print(f"  drivers supplied : {drivers or '(none)'}")
          print(f"  held at anchor   : {held or '(none)'}")
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"TICKER={ticker}\n")
          with open("payload.json", "w") as fh:
              json.dump(p, fh)
          EOF

      # Build -> re-point rates from the live feed -> apply payload -> recalc -> GATES.
      # run_company fails non-zero if the completeness/provenance gates or the standing
      # four-method tie check fail, so a payload that breaks the model cannot be committed.
      - name: Run valuation
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MARKET_DATA_DIR: ${{ github.workspace }}/market-data-checkout
        run: |
          python pipeline/run_company.py "companies/${TICKER}.yaml" \
            --rate-feed-live \
            --payload payload.json \
            --out-dir outputs \
            --vintage "run-$(date -u +%FT%TZ)"

      # On a tie/audit failure the recalced workbook holds the offending #N/A, but the
      # Actions API can't inspect a recalced workbook. Surface it: dump the error cell(s),
      # their formulas, precedent values, and the Minority-Interest row to the log and a
      # <TICKER>_diag.json artifact. Runs ONLY on failure; a green run skips it. This is a
      # permanent capability — every future ticker's tie/audit failure is now log-diagnosable.
      - name: Diagnose tie/audit failure
        if: failure()
        run: |
          mkdir -p outputs
          python pipeline/diagnose_tie.py "pipeline/_work/${TICKER}_engine.xlsx" \
            --ticker "${TICKER}" --json "outputs/${TICKER}_diag.json" || true

      - name: Upload diagnostic artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TICKER }}_diag
          path: |
            outputs/${{ env.TICKER }}_diag.json
            pipeline/_work/${{ env.TICKER }}_engine.xlsx
          if-no-files-found: warn

      - name: Commit outputs
        run: |
          git config user.name "aeg-bot"
          git config user.email "aeg-bot@users.noreply.github.com"
          git add outputs/
          git commit -m "run: ${TICKER} forecast valuation $(date -u +%F)" || echo "no changes to commit"
          # Rebase onto whatever branch THIS run actually checked out -- "origin main" was
          # hardcoded, which works for the normal case (dispatched on main) but rebases a
          # feature-branch dispatch onto a diverged main and leaves the runner in a detached,
          # unpushable state. Found 2026-08-21 dispatching idio-v2-wiring for a GATED tie-proof;
          # the valuation itself succeeded (tie PASS) but this step failed with "not currently
          # on a branch". Harmless to that proof -- outputs from an unmerged branch shouldn't
          # land on main anyway -- but worth fixing so the next branch dispatch actually commits.
          CURRENT_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          git pull --rebase --autostash origin "$CURRENT_BRANCH" || true
          git push origin "HEAD:$CURRENT_BRANCH"

      - name: Summary
        if: always()
        run: |
          echo "### RUN valuation — ${TICKER}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "outputs/${TICKER}_summary.csv" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat "outputs/${TICKER}_summary.csv" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "_no summary produced — the run failed a gate; see the log above._" >> $GITHUB_STEP_SUMMARY
          fi

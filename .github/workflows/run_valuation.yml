name: run-valuation (cockpit RUN button)

# Dispatch-ONLY. Driven by the Cost of Capital cockpit's RUN button via the Apps Script
# (COCKPIT dispatch contract 20260722-0800). Deliberately separate from valuation.yml:
# that one is the CI path (fires on push), and a malformed payload here must never be able
# to redden CI.
#
# workflow_dispatch inputs are strings, so the WHOLE payload rides as ONE JSON string:
#   { "ticker": "AAPL", "mode": "Equity"|"Enterprise", "N": 1..30,
#     "drivers": { revenue_growth|gross_margin|sga_ratio|da_rate|tax_rate|
#                  buyback_rate|capex_ratio|noa_growth : [ ..N values.. ] },
#     "singles": { "payout": <num>, "target_flev": <num> } }
#
# A driver ABSENT from `drivers` is not written at all, so it keeps its existing formula
# (hold flat at the FY0 anchor, or the legacy scenario overlay). That is what makes a
# legacy run bit-identical — verified: empty payload reproduces the engine to the digit.

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "AEG forecast payload (JSON)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: run-valuation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout market-data (canonical company data store)
        uses: actions/checkout@v4
        with:
          repository: JamesKostohryz/market-data
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: market-data-checkout

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LibreOffice (headless recalc)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-calc

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fail fast on a malformed payload BEFORE building anything, so a bad button press
      # costs seconds and produces a readable error instead of a mid-pipeline traceback.
      - name: Validate payload
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          python - <<'EOF'
          import json, os, sys
          sys.path.insert(0, "pipeline"); sys.path.insert(0, ".")
          import apply_payload as AP
          raw = os.environ["PAYLOAD"]
          try:
              p = AP.load_payload(raw)
          except AP.PayloadError as e:
              print(f"::error::{e}"); sys.exit(1)

          # Multi-scenario dispatch (payload.scenarios present): the machine-file shape
          # run_scenarios.py / run_company.py already consume in production, gated behind
          # payload.scenarios exactly as the pipeline is. Added 2026-08-12 because this
          # pre-flight step was still assuming the single-scenario shape and rejected every
          # scenarios payload with "mode must be ... got None" before run_company.py ever
          # got a chance to route it correctly. Mirrors what run_company.py itself does:
          # validate_overrides() at the top level, then a structural + per-scenario driver
          # check here so a malformed scenario still fails fast, before LibreOffice spins
          # up, rather than only failing deep inside the "Run valuation" step.
          if p.get("scenarios") is not None:
              import run_scenarios as RS
              try:
                  AP.validate_overrides(p)
                  ticker = p.get("ticker")
                  if not isinstance(ticker, str) or not ticker.strip():
                      raise AP.PayloadError("'ticker' must be a non-empty string")
                  names, total = RS._validate_scenarios(p["scenarios"])
                  if abs(total - 1.0) > RS.PROB_TOL:
                      print(f"::warning::scenario probabilities sum to {total}, not 1.0 "
                            f"(tolerance {RS.PROB_TOL}) -- cockpit-enforced, not blocked here")
                  for sc in p["scenarios"]:
                      single = {"ticker": ticker, "mode": sc.get("mode"), "N": sc.get("N"),
                                "drivers": sc.get("drivers") or {}, "singles": sc.get("singles") or {}}
                      AP.validate_payload(single)
              except AP.PayloadError as e:
                  print(f"::error::{e}"); sys.exit(1)
              except RS.ScenariosError as e:
                  print(f"::error::{e}"); sys.exit(1)
              cfg = os.path.join("companies", f"{ticker}.yaml")
              if not os.path.exists(cfg):
                  print(f"::error::no config for {ticker} ({cfg}). Onboard it first.")
                  sys.exit(1)
              print(f"payload OK: {ticker} scenarios={names} (probabilities sum to {total})")
              with open(os.environ["GITHUB_ENV"], "a") as fh:
                  fh.write(f"TICKER={ticker}\n")
              with open("payload.json", "w") as fh:
                  json.dump(p, fh)
              sys.exit(0)

          try:
              ticker, mode, N = AP.validate_payload(p)
          except AP.PayloadError as e:
              print(f"::error::{e}"); sys.exit(1)
          cfg = os.path.join("companies", f"{ticker}.yaml")
          if not os.path.exists(cfg):
              print(f"::error::no config for {ticker} ({cfg}). Onboard it first: "
                    f"python pipeline/onboard.py {ticker} --check-only  (then without --check-only). "
                    f"If that reports NOT READY, the rate side must publish coe_v2_{ticker} first.")
              sys.exit(1)
          drivers = sorted((p.get("drivers") or {}))
          held = sorted(set(AP.DRIVER_ROWS) - set(drivers))
          print(f"payload OK: {ticker} mode={mode} N={N}")
          print(f"  drivers supplied : {drivers or '(none)'}")
          print(f"  held at anchor   : {held or '(none)'}")
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"TICKER={ticker}\n")
          with open("payload.json", "w") as fh:
              json.dump(p, fh)
          EOF

      # Build -> re-point rates from the live feed -> apply payload -> recalc -> GATES.
      # run_company fails non-zero if the completeness/provenance gates or the standing
      # four-method tie check fail, so a payload that breaks the model cannot be committed.
      - name: Run valuation
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MARKET_DATA_DIR: ${{ github.workspace }}/market-data-checkout
        run: |
          python pipeline/run_company.py "companies/${TICKER}.yaml" \
            --rate-feed-live \
            --payload payload.json \
            --out-dir outputs \
            --vintage "run-$(date -u +%FT%TZ)"

      # On a tie/audit failure the recalced workbook holds the offending #N/A, but the
      # Actions API can't inspect a recalced workbook. Surface it: dump the error cell(s),
      # their formulas, precedent values, and the Minority-Interest row to the log and a
      # <TICKER>_diag.json artifact. Runs ONLY on failure; a green run skips it. This is a
      # permanent capability — every future ticker's tie/audit failure is now log-diagnosable.
      - name: Diagnose tie/audit failure
        if: failure()
        run: |
          mkdir -p outputs
          python pipeline/diagnose_tie.py "pipeline/_work/${TICKER}_engine.xlsx" \
            --ticker "${TICKER}" --json "outputs/${TICKER}_diag.json" || true

      - name: Upload diagnostic artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TICKER }}_diag
          path: |
            outputs/${{ env.TICKER }}_diag.json
            pipeline/_work/${{ env.TICKER }}_engine.xlsx
          if-no-files-found: warn

      - name: Commit outputs
        run: |
          git config user.name "aeg-bot"
          git config user.email "aeg-bot@users.noreply.github.com"
          git add outputs/
          git commit -m "run: ${TICKER} forecast valuation $(date -u +%F)" || echo "no changes to commit"
          git pull --rebase --autostash origin main || true
          git push

      - name: Summary
        if: always()
        run: |
          echo "### RUN valuation — ${TICKER}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "outputs/${TICKER}_summary.csv" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat "outputs/${TICKER}_summary.csv" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "_no summary produced — the run failed a gate; see the log above._" >> $GITHUB_STEP_SUMMARY
          fi

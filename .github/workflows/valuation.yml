name: AEG valuation pipeline

on:
  push:
    branches: [main]
    paths:
      - "companies/**"
      - "pipeline/**"
      - "*.py"
      - ".github/workflows/valuation.yml"
  pull_request:
    paths:
      - "companies/**"
      - "pipeline/**"
      - "*.py"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Single ticker to run (blank = all changed configs)"
        required: false
        default: ""

concurrency:
  group: valuation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  valuation:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN raises the GitHub REST rate limit from 60 requests an hour PER IP to 1,000,
    # which is what lets idio/market_erp_live.py establish the VINTAGE of the aggregate credit
    # curve. Unauthenticated, a shared runner burns 60 in minutes and gets 403 -- and until
    # 2026-08-20 that silently disabled the freshness check on COMMON(t), which is charged to
    # every company at every tenor. It now REFUSES instead, so without this the run stops.
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout (with history for change detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Checkout market-data (canonical company data store)
        uses: actions/checkout@v4
        with:
          repository: JamesKostohryz/market-data
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: market-data-checkout

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LibreOffice + Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc
          python -m pip install --upgrade pip
          # requirements.txt, not a hand-kept list. This line read
          # `pip install openpyxl==3.1.5 pyyaml` until 2026-08-19 while requirements.txt
          # described itself as the dependency source of truth FOR THIS WORKFLOW -- so the
          # market-data consolidation's pyarrow never reached the runner and the only two
          # companies with a reviewed forecast crashed on every run. numpy was missing here
          # too. A source of truth two workflows do not read is a comment.
          pip install -r requirements.txt

      - name: Determine companies to run
        id: pick
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            echo "list=companies/${{ github.event.inputs.ticker }}.yaml" >> "$GITHUB_OUTPUT"
          else
            # .forecast.json counts as a change to that company. It did not until 2026-08-20,
            # so editing a horizon or a driver -- the most consequential edit anyone makes here --
            # selected NO company and silently fell through to re-running the whole fleet.
            CHANGED=$(git diff --name-only HEAD^ HEAD -- 'companies/*.yaml' 'companies/*.forecast.json' | \
                      sed 's|\.forecast\.json$|.yaml|' | sort -u || true)
            if [ -z "$CHANGED" ]; then
              CHANGED=$(ls companies/*.yaml)
            fi
            echo "list=$(echo $CHANGED | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi
          echo "Running: $(cat "$GITHUB_OUTPUT")"

      - name: Run pipeline (gates are required checks)
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MARKET_DATA_DIR: ${{ github.workspace }}/market-data-checkout
        run: |
          set -euo pipefail
          VINTAGE=$(date -u +%Y-%m-%dT%H:%MZ)
          # Collect outcomes instead of aborting on the first one. Every gate in
          # run_company.py exits non-zero by design, and under a bare set -e loop the first
          # refusal stopped every company after it alphabetically, so one company awaiting a
          # human review silently froze the outputs of all the others.
          #
          # TWO BUCKETS, NOT ONE (2026-08-19, James). Exit 3 is AWAITING FORECAST: nobody has
          # forecast that company yet. Rule D1 makes forecasting permanently human-in-the-loop,
          # so there was never going to be a number and there is nothing to fix. Fourteen of the
          # sixteen configs on file are in that state, which meant this workflow was red on
          # every run and could not have been anything else -- and a check that is always red
          # stops being read. It hid a real crash for a day: pyarrow was missing from
          # requirements, and the only two companies that COULD publish were failing inside the
          # noise of twelve intended refusals.
          #
          # Every other non-zero exit is a genuine refusal or a break and still fails the run.
          # The awaiting list is printed every time as a notice, so those names get more
          # attention than a permanently red X was giving them, not less.
          REFUSED=""
          AWAITING=""
          for cfg in ${{ steps.pick.outputs.list }}; do
            echo "::group::$cfg"
            set +e
            python pipeline/run_company.py "$cfg" \
              --rate-feed-live \
              --out-dir outputs \
              --vintage "$VINTAGE"
            RC=$?
            set -e
            if [ "$RC" -eq 3 ]; then
              AWAITING="$AWAITING $cfg"
            elif [ "$RC" -ne 0 ]; then
              REFUSED="$REFUSED $cfg"
            fi
            echo "::endgroup::"
          done
          if [ -n "$AWAITING" ]; then
            echo "::notice::awaiting a reviewed forecast (no valuation, as intended):$AWAITING"
          fi
          {
            echo "### AEG fleet"
            echo ""
            echo "- awaiting a reviewed forecast:${AWAITING:- none}"
            echo "- refused or failed:${REFUSED:- none}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$REFUSED" ]; then
            echo "::error::refused or failed:$REFUSED"
            exit 1
          fi

      - name: Commit refreshed outputs (push to main only)
        # always() so a refusal does not freeze the fleet's outputs. Without it GitHub adds an
        # implicit success() to this custom if:, so ANY refusal skipped this step and nothing was
        # committed at all - the very freeze 60f8822 set out to prevent, just moved one step later.
        # A refused company writes no outputs (run_company _fails first), so it simply holds at its
        # last good vintage while the others refresh; status.csv carries vintage + config_hash so
        # the Cockpit can see which names are stale.
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name  "aeg-pipeline[bot]"
          git config user.email "aeg-pipeline@users.noreply.github.com"
          git add outputs/
          if git diff --cached --quiet; then
            echo "no output changes"
          else
            git commit -m "pipeline: refresh valuation outputs [skip ci]"
            git push
          fi

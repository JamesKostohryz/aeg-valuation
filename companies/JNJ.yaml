# Per-company statement-adjustment config — Johnson & Johnson
# AUTO-GENERATED by pipeline/onboard.py. Every field is a committed, reviewable judgment:
# change it in a PR and the restated statements change deterministically.
#
# Rate readiness at onboarding: coe_v2 + cod(30 tenors) + company OK; market_value_of_debt=4.439e+10; nfo_basis=market
company: "Johnson & Johnson"
ticker: JNJ
fy_end_month: 0          # 0 = auto-detect from statement dates

forecast:
  # P2 — the explicit forecast horizon cfg_N: the competitive-advantage period, i.e. the
  # number of years abnormal earnings growth is judged to persist for THIS company. There
  # is deliberately no default; the value below is what this name was already running at
  # when the horizon became an explicit input, and it has NOT yet been reviewed. Set
  # reviewed: true once you have deliberately chosen it. Any integer 1..30; 4 is fine.
  # HORIZON PROVENANCE: not studied. Value selected by Claude and authorized by James
  # on 2026-08-09 ("You select the numbers. I don't care what they are... If I ever
  # decide to do a valuation of those companies I will study the matter."). MUST be
  # revisited before this company is published. See
  # claude/AEG-DECISIONS-SETTLED-DO-NOT-REASK-2026-08-09.md
  horizon_N: 8
  #
  # SET TO false ON 2026-08-13. Until this date every file below carried `reviewed: true`
  # two lines under a comment saying the horizon was never studied. The horizon gate exists
  # to stop an unreviewed N reaching a valuation, and it was passing on a blanket 2026-08-09
  # authorization rather than on a review -- reporting a review that did not happen, on the
  # one input this project's own notes say has twice determined the SIGN of the abnormal
  # earnings stream. No published number moved: all thirteen of these companies are refused
  # by the funding gate or the truncation gates anyway. What changes is that the config now
  # asserts something true. To value this company, do the work, choose N deliberately by
  # extending the forecast until Gate A and Gate B both hold, and set reviewed: true with a
  # note saying what you did -- exactly as companies/PEP.yaml does.
  reviewed: false
judgments:
  minority_include: false      # exclude minority interest from common equity
  finlease: 0.0                # KEEP 0.0. The add-back is NOT wired: in_finlease feeds no engine
                               # formula and NFO = in_debt - in_cash - in_sti, so a non-zero value
                               # silently does nothing (the run refuses it). EODHD 'Total Debt'
                               # already includes capitalized finance leases for most names, so 0.0
                               # is correct; an extra add-back is an engine-backlog item.
  oi_adj_override: null        # KEEP null. NOT a working normalization knob: the economic
                               # restatement anchors on reported operating income, and this value
                               # feeds only an audit identity requiring it to EQUAL reported OI, so
                               # a real override breaks the tie (the run refuses it). To value a
                               # cyclical on a representative base, repoint FY0 to a representative
                               # fiscal year instead. (Normalized-anchor override = engine backlog.)
  rd_capitalize: false         # KEEP false. R&D capitalization is currently INERT: the Cap Engine
                               # reserve is computed but referenced nowhere downstream, so true
                               # changes neither NOA nor operating income (it does NOT capitalize
                               # R&D). Do not set true expecting a capitalized-R&D restatement until
                               # the capitalization increment is wired (engine backlog).
  rd_life: 5.0                 # (unused while rd_capitalize is inert)
  dps_override: null           # override near-term dividend (null = from dividends file)

# !! NOT AUTO-DETECTED — a spin-off cannot be inferred from statements. If JNJ has had one,
# per-share history is WRONG until you set these by hand (see companies/T.yaml, factor 1.324
# before 2022 for the WBD spin).
spinoff:
  factor: 1.0                  # contemporaneous-price spinoff factor (1.0 = none)
  before_year: 0               # apply the factor to fiscal years before this (0 = n/a)

price:
  source: market               # "market" = latest close from the staged prices file
  override: null

cost_of_debt:
  source: bond_list            # validated against the live cod_JNJ curve at onboarding

bonded: true                   # cod_JNJ / company_JNJ published upstream and contract-valid

# Forecast row 61 is the reported-vs-economic operating-expense wedge (R&D + other opex).
# Left UNASSERTED (false) on purpose: setting true makes the run ABORT unless the wedge is
# ~0, which is a real claim about the business. Flip it only once you've seen this name's
# wedge and believe it should be zero (see companies/T.yaml).
expect_zero_rd_wedge: false

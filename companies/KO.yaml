# Per-company statement-adjustment config — The Coca-Cola Company
# AUTO-GENERATED by pipeline/onboard.py. Every field is a committed, reviewable judgment:
# change it in a PR and the restated statements change deterministically.
#
# Rate readiness at onboarding: coe_v2 + cod(30 tenors) + company OK; market_value_of_debt=3.615e+10; nfo_basis=market
company: "The Coca-Cola Company"
ticker: KO
fy_end_month: 0          # 0 = auto-detect from statement dates

forecast:
  # ROUND 2, 2026-08-13. N chosen mechanically: extending the explicit forecast until Gate A
  # (abnormal earnings growth spent/declining at year N) and Gate B (EPS at year N within 15%
  # of the forecast's own normalized level) both hold, on a driver path benchmarked against
  # Coca-Cola's own history and tied to docs/KO-Round1-Qualitative-Brief-2026-08-13.md and
  # docs/KO-Round2-Base-Case-Drivers-2026-08-13.md (which records the run history: every
  # candidate N tested and the Gate A/B figures at each).
  horizon_N: 14
  reviewed: true
judgments:
  minority_include: false      # exclude minority interest from common equity
  finlease: 0.0                # KEEP 0.0. The add-back is NOT wired: in_finlease feeds no engine
                               # formula and NFO = in_debt - in_cash - in_sti, so a non-zero value
                               # silently does nothing (the run refuses it). EODHD 'Total Debt'
                               # already includes capitalized finance leases for most names, so 0.0
                               # is correct; an extra add-back is an engine-backlog item.
  oi_adj_override: null        # KEEP null. NOT a working normalization knob: the economic
                               # restatement anchors on reported operating income, and this value
                               # feeds only an audit identity requiring it to EQUAL reported OI, so
                               # a real override breaks the tie (the run refuses it). To value a
                               # cyclical on a representative base, repoint FY0 to a representative
                               # fiscal year instead. (Normalized-anchor override = engine backlog.)
  rd_capitalize: false         # KEEP false. R&D capitalization is currently INERT: the Cap Engine
                               # reserve is computed but referenced nowhere downstream, so true
                               # changes neither NOA nor operating income (it does NOT capitalize
                               # R&D). Do not set true expecting a capitalized-R&D restatement until
                               # the capitalization increment is wired (engine backlog).
  rd_life: 5.0                 # (unused while rd_capitalize is inert)
  dps_override: null           # override near-term dividend (null = from dividends file)

# !! NOT AUTO-DETECTED — a spin-off cannot be inferred from statements. If KO has had one,
# per-share history is WRONG until you set these by hand (see companies/T.yaml, factor 1.324
# before 2022 for the WBD spin).
spinoff:
  factor: 1.0                  # contemporaneous-price spinoff factor (1.0 = none)
  before_year: 0               # apply the factor to fiscal years before this (0 = n/a)

price:
  source: market               # "market" = latest close from the staged prices file
  override: null

cost_of_debt:
  source: bond_list            # validated against the live cod_KO curve at onboarding

bonded: true                   # cod_KO / company_KO published upstream and contract-valid

# Forecast row 61 is the reported-vs-economic operating-expense wedge (R&D + other opex).
# Left UNASSERTED (false) on purpose: setting true makes the run ABORT unless the wedge is
# ~0, which is a real claim about the business. Flip it only once you've seen this name's
# wedge and believe it should be zero (see companies/T.yaml).
expect_zero_rd_wedge: false

terminal:
  # ROUND 2, 2026-08-13. Dividends-only payout of normalized net income once the continuing
  # period begins (year cfg_N+1 onward). 0.67 matches Coca-Cola's own 2025 actual (dividends
  # $8,779mm / net income $13,107mm = 0.670, and the engine's own anchor retention-implied
  # payout of 0.671284) and sixty-four consecutive years of dividend increases with an
  # explicit no-further-capital-needs policy (Round 1 brief, section 7 and Appendix A).
  payout_ratio: 0.67
  reviewed: true
  note: "Matches KO's own 2025 dividends-only payout (0.670) and disclosed anti-dilution-only buyback policy; no capital needs identified that would justify a lower terminal payout."

convergence:
  # DIAGNOSTIC ESCAPE HATCH -- 2026-08-13, temporary. Used only to let a failed-truncation run
  # complete and commit its outputs/KO_aeg_schedule.csv and KO_periods.csv so the full year-by-year
  # AEG path can be inspected (failed runs do not commit outputs). NOT an accepted truncation --
  # removed before Round 2 is finalized. Do not treat this as James's or the analyst's acceptance
  # of N=12.
  reviewed: true
  note: "DIAGNOSTIC ONLY -- inspecting the AEG path to re-tune drivers/N; this horizon has not been accepted."

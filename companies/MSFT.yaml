# Per-company statement-adjustment config — Microsoft Corporation
# AUTO-GENERATED by pipeline/onboard.py. Every field is a committed, reviewable judgment:
# change it in a PR and the restated statements change deterministically.
#
# Rate readiness at onboarding: coe_v2 + cod(30 tenors) + company OK; market_value_of_debt=1.103e+11; nfo_basis=market
company: "Microsoft Corporation"
ticker: MSFT
fy_end_month: 0          # 0 = auto-detect from statement dates

# THE ONE THING ONBOARDING CANNOT DO FOR YOU, LEFT DELIBERATELY BLANK.
#
# forecast.horizon_N is cfg_N, the competitive-advantage period: the number of years YOU judge
# abnormal earnings growth to persist for this company. It is the single most powerful judgment
# in the model -- worth 31% on the Apple fixture between 4 and 30 years -- and rule D1 makes it
# permanently human. There is no default, no suggestion here, and there never will be, because
# suggesting one is how the last default got established.
#
# Until both lines below are filled in and uncommented, MSFT is AWAITING FORECAST: it produces no
# valuation, and the fleet run lists it by name every time so it is not forgotten.
#
forecast:
  horizon_N: 12                # James Kostohryz, 2026-08-20.
  reviewed: true
  # WHY TWELVE, AND WHAT THE DRIVERS ARE BUILT TO SATISFY.
  #
  # The rule James stated, 2026-08-20: "the only thing that matters is the return on
  # INCREMENTAL capital invested. That is what must equal the COE by the first year of the
  # continuing period. It does not matter how high the return on capital is; it only matters
  # what the return on incremental capital invested is."
  #
  # That is the forecaster kit's own bar (section 7.2): RORE_real > rho_real, return on
  # RETAINED capital in real terms against the real cost of equity -- and the kit warns in 7.3
  # that comparing the published nominal columns drops the inflation carry and gave the wrong
  # answer in eight of Coca-Cola's twelve forecast years.
  #
  # So the driver set is solved, not chosen, on
  #     (NOPAT_t / (1 + pi_t) - NOPAT_{t-1}) / delta_NOA_{t-1}  ->  rho_real  at t = 12
  # using expected inflation from the published curve (2.93% falling to 2.29%) and Microsoft's
  # real cost of equity at tenor 30. Real return on incremental capital falls 11.66% -> 6.70%
  # and lands ON the cost of capital in the last explicit year, so the continuing period opens
  # with abnormal earnings growth spent rather than truncated while still running.
  #
  # AVERAGE return on net operating assets still ends near 20%, and that is correct and not the
  # test. The legacy book keeps earning its rent -- capitalised in the anchor -- while the
  # marginal dollar stops earning an excess. Microsoft is still investing about $81bn in year
  # 12; the forecast says that dollar earns exactly its cost of capital.
  #
  # Revenue growth fading 14.0% -> 4.4% and gross margin 67.9% -> 65.9% (infrastructure
  # diluting software) are James's judgments of the business; the NOA path is arithmetic given
  # them and the rule above.

# The continuing period, year 13 onward: what Microsoft does with its cash once it no longer
# earns anything above its cost of capital on new investment.
terminal:
  payout_ratio: 0.40         # James Kostohryz, 2026-08-20. DIVIDENDS ONLY; retention is the rest.
  reviewed: true
  # WHY NOT MICROSOFT'S OWN ANCHOR-YEAR PAYOUT, which is the convention used for Coca-Cola
  # (0.670) and PepsiCo (0.777). Microsoft's dividends-only payout is 19.8% and FALLING --
  # 34.2% in FY2020, 24.7% in FY2024, 19.8% in FY2026 ($26.4bn of dividends on $133.7bn of net
  # income) -- because earnings have outrun the dividend during the buildout. For Coca-Cola and
  # PepsiCo the anchor-year ratio happened to be a mature one; for Microsoft it is not, and
  # carrying 19.8% into perpetuity would assert that Microsoft retains four-fifths of its
  # earnings forever while earning only its cost of capital on them.
  #
  # 0.40 is roughly double the current dividend without going all the way to a Coca-Cola
  # profile: it says the payout rises materially once profitable growth is exhausted, but that
  # Microsoft keeps a reinvestment culture and a large buyback. NOTE that buybacks are NOT
  # counted here -- this gate is dividends only, so a company distributing heavily by
  # repurchase still shows a low ratio.

judgments:
  minority_include: false      # exclude minority interest from common equity
  finlease: 0.0                # KEEP 0.0. The add-back is NOT wired: in_finlease feeds no engine
                               # formula and NFO = in_debt - in_cash - in_sti, so a non-zero value
                               # silently does nothing (the run refuses it). EODHD 'Total Debt'
                               # already includes capitalized finance leases for most names, so 0.0
                               # is correct; an extra add-back is an engine-backlog item.
  oi_adj_override: null        # KEEP null. NOT a working normalization knob: the economic
                               # restatement anchors on reported operating income, and this value
                               # feeds only an audit identity requiring it to EQUAL reported OI, so
                               # a real override breaks the tie (the run refuses it). To value a
                               # cyclical on a representative base, repoint FY0 to a representative
                               # fiscal year instead. (Normalized-anchor override = engine backlog.)
  rd_capitalize: false         # KEEP false. R&D capitalization is currently INERT: the Cap Engine
                               # reserve is computed but referenced nowhere downstream, so true
                               # changes neither NOA nor operating income (it does NOT capitalize
                               # R&D). Do not set true expecting a capitalized-R&D restatement until
                               # the capitalization increment is wired (engine backlog).
  rd_life: 5.0                 # (unused while rd_capitalize is inert)
  dps_override: null           # override near-term dividend (null = from dividends file)

# !! NOT AUTO-DETECTED — a spin-off cannot be inferred from statements. If MSFT has had one,
# per-share history is WRONG until you set these by hand (see companies/T.yaml, factor 1.324
# before 2022 for the WBD spin).
spinoff:
  factor: 1.0                  # contemporaneous-price spinoff factor (1.0 = none)
  before_year: 0               # apply the factor to fiscal years before this (0 = n/a)

price:
  source: market               # "market" = latest close from the staged prices file
  override: null

cost_of_debt:
  source: bond_list            # validated against the live cod_MSFT curve at onboarding

bonded: true                   # cod_MSFT / company_MSFT published upstream and contract-valid

# Forecast row 61 is the reported-vs-economic operating-expense wedge (R&D + other opex).
# Left UNASSERTED (false) on purpose: setting true makes the run ABORT unless the wedge is
# ~0, which is a real claim about the business. Flip it only once you've seen this name's
# wedge and believe it should be zero (see companies/T.yaml).
expect_zero_rd_wedge: false
